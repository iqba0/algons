<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Algoritma Dasar: Searching, Sorting, Stack & Queue</title>
<style>
:root{
  --bg:#f3f5fb;--card:#fff;--ink:#1e293b;--muted:#64748b;--line:#e2e8f0;--navy:#0f1d3d;
  --accent:#2563eb;--accent-soft:#e8efff;
  --ok:#16a34a;--ok-soft:#dcfce7;--bad:#e11d48;--bad-soft:#ffe4e9;--warn:#d97706;--warn-soft:#fef3c7;
  --vio:#7c3aed;--vio-soft:#ede9fe;
  --r:14px;--shadow:0 1px 2px rgba(15,29,61,.06),0 8px 24px rgba(15,29,61,.06);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{line-height:1.25;margin:0 0 .5em;color:var(--navy)}
h3{font-size:1.15rem}
p{margin:.4em 0 .8em}
ul,ol{margin:.3em 0 .8em;padding-left:1.3em}
li{margin:.25em 0}
.app{max-width:1080px;margin:0 auto;padding:14px}

/* header */
.top{background:linear-gradient(135deg,#0f1d3d 0%,#1e3a8a 100%);color:#fff;border-radius:18px;padding:16px 22px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;box-shadow:var(--shadow)}
.brand{display:flex;gap:12px;align-items:center}
.logo{width:46px;height:46px;border-radius:12px;background:rgba(255,255,255,.14);display:grid;place-items:center;font-size:24px}
.brand h1{color:#fff;font-size:1.25rem;margin:0}
.brand p{margin:0;color:#c7d2fe;font-size:.85rem}
.who{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.who label{font-size:.78rem;color:#c7d2fe;display:block}
.who input{border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;border-radius:10px;padding:7px 10px;width:190px}
.who input::placeholder{color:#a5b4fc}
.prog{min-width:170px}
.prog .t{font-size:.78rem;color:#c7d2fe}
.prog .b{height:8px;border-radius:99px;background:rgba(255,255,255,.2);overflow:hidden;margin-top:4px}
.prog .b i{display:block;height:100%;background:linear-gradient(90deg,#34d399,#22d3ee);border-radius:99px;transition:width .5s}

/* nav */
nav{display:flex;gap:6px;overflow-x:auto;padding:12px 2px 6px;scrollbar-width:thin}
nav button{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 14px;cursor:pointer;font-size:.9rem;white-space:nowrap;transition:.15s}
nav button:hover{border-color:var(--accent)}
nav button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
nav .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-left:6px}

/* generic */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin:12px 0;box-shadow:var(--shadow)}
.panel.soft{background:var(--accent-soft);border-color:transparent;box-shadow:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid2>.panel{margin:0}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.grid2,.grid3{grid-template-columns:1fr}.who input{width:150px}}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:.92rem;transition:.15s}
.btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover:not(:disabled){filter:brightness(1.08);color:#fff}
.btn.big{padding:11px 20px;font-size:1rem}
.btn.danger{color:var(--bad)}
.btn.good{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.good:hover:not(:disabled){color:#fff;filter:brightness(1.08)}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.bad:hover:not(:disabled){color:#fff;filter:brightness(1.08)}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}
.chip{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:2px 10px;font-size:.8rem;font-weight:700}
.muted{color:var(--muted)}
.sec{margin:26px 0 8px}

/* hero */
.hero{display:flex;gap:20px;align-items:center;justify-content:space-between;background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;margin-top:12px;box-shadow:var(--shadow)}
.hero h2{font-size:1.6rem}
.ring{flex:0 0 auto;text-align:center}
.ring svg{display:block}
.ring .n{font-size:1.4rem;font-weight:800;color:var(--navy)}
@media(max-width:700px){.hero{flex-direction:column;text-align:center}}
.path{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:860px){.path{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.path{grid-template-columns:1fr}}
.tcard{background:#fff;border:1px solid var(--line);border-top:5px solid var(--c,#2563eb);border-radius:var(--r);padding:16px;cursor:pointer;text-align:left;transition:.18s;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px}
.tcard:hover{transform:translateY(-3px)}
.tcard .ic{font-size:1.8rem}
.tcard b{color:var(--navy)}
.tcard small{color:var(--muted);line-height:1.4}
.lvdots{display:flex;gap:5px;margin-top:auto;align-items:center}
.lvdots i{width:22px;height:8px;border-radius:99px;background:var(--line)}
.lvdots i.ok{background:var(--ok)}
.lvdots span{font-size:.75rem;color:var(--muted);margin-left:6px}
.steps3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:700px){.steps3{grid-template-columns:1fr}}
.steps3 .panel{margin:0}
.num{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;font-weight:700;margin-bottom:6px}
table.cmp{width:100%;border-collapse:collapse;font-size:.92rem;background:#fff;border-radius:12px;overflow:hidden}
table.cmp th,table.cmp td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
table.cmp th{background:#f1f5f9;color:var(--navy)}
.tblwrap{overflow-x:auto}

/* topic header */
.thead{background:#fff;border:1px solid var(--line);border-left:8px solid var(--accent);border-radius:var(--r);padding:16px 20px;display:flex;gap:14px;align-items:center;margin-top:8px;box-shadow:var(--shadow)}
.thead .ic{font-size:2.2rem}
.thead h2{margin:0;font-size:1.4rem}
.thead p{margin:0;color:var(--muted)}
.tabs{display:flex;gap:6px;margin:14px 0 4px;flex-wrap:wrap}
.tabs button{border:0;background:#e9edf6;border-radius:10px;padding:9px 16px;cursor:pointer;font-weight:600;color:#475569}
.tabs button.on{background:var(--accent);color:#fff}
.seg{display:inline-flex;background:#e9edf6;border-radius:10px;padding:3px;gap:2px;margin-bottom:10px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:8px;padding:6px 14px;cursor:pointer;font-weight:600;color:#475569;font-size:.9rem}
.seg button.on{background:#fff;color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* concept */
.goal{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.goal span{background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:4px 10px;font-size:.88rem;font-weight:600}
.callout{background:var(--warn-soft);border-color:#fde68a}
ol.steps{list-style:none;counter-reset:s;padding:0}
ol.steps li{counter-increment:s;position:relative;padding:8px 10px 8px 46px;margin:8px 0;background:#f8fafc;border-radius:10px}
ol.steps li::before{content:counter(s);position:absolute;left:10px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:.85rem}
.plus li::marker{content:"✔  ";color:var(--ok)}
.minus li::marker{content:"✖  ";color:var(--bad)}
.ilus{display:flex;flex-direction:column;gap:14px}
.ilus .fr{border:1px dashed #cbd5e1;border-radius:12px;padding:10px 12px;background:#fcfdff}
.ilus .cap{font-size:.9rem;color:#334155;margin-top:4px}
.ilus .row3{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.ilus .row3>div{text-align:center;flex:1 1 140px}
.tip{border-left:4px solid var(--warn);background:var(--warn-soft);padding:8px 12px;border-radius:0 10px 10px 0;margin:8px 0}

/* cells + bars */
.stage{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 8px;overflow-x:auto}
.cells{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.cw{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:46px}
.ptr{min-height:20px;font-size:.72rem;font-weight:800;color:var(--accent);letter-spacing:.02em;white-space:nowrap}
.idx{font-size:.72rem;color:var(--muted)}
.cell,.sw{border:2px solid #cbd5e1;background:#fff;border-radius:10px}
.cell{min-width:46px;height:46px;display:grid;place-items:center;font-weight:800;font-size:1.05rem;transition:all .25s}
.cells.mini .cell{min-width:34px;height:34px;font-size:.9rem}
.cells.mini .cw{min-width:34px}
.cells.mini{gap:5px}
.sw{display:inline-block;width:16px;height:16px;border-radius:5px;vertical-align:-3px;margin-right:6px;border-width:2px}
.cell.cmp,.sw.cmp,.bar.cmp{border-color:#f59e0b;background:#fef3c7}
.cell.found,.sw.found,.bar.found{border-color:var(--ok);background:var(--ok-soft);color:#14532d}
.cell.dim,.sw.dim,.bar.dim{opacity:.4;background:#f1f5f9}
.cell.range,.sw.range,.bar.range{border-color:#93c5fd;background:var(--accent-soft)}
.cell.mid,.sw.mid,.bar.mid{border-color:var(--accent);background:#bfdbfe;transform:translateY(-4px)}
.cell.sorted,.sw.sorted,.bar.sorted{border-color:var(--ok);background:var(--ok-soft)}
.cell.swap,.sw.swap,.bar.swap{border-color:var(--bad);background:var(--bad-soft)}
.cell.min,.sw.min,.bar.min{border-color:var(--vio);background:var(--vio-soft)}
.cell.hid{background:#334155;border-color:#334155;color:#94a3b8}
.cell.clk,.bar.clk{cursor:pointer}
.cell.clk:hover,.bar.clk:hover{filter:brightness(.95);transform:translateY(-2px)}
.bars{display:flex;align-items:flex-end;justify-content:center;gap:8px;min-height:200px}
.bw{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1 1 0;max-width:68px;min-width:30px}
.bar{width:100%;border:2px solid #94a3b8;background:#e2e8f0;border-radius:8px 8px 4px 4px;display:flex;justify-content:center;align-items:flex-start;font-weight:800;padding-top:4px;transition:all .25s}
.bars.mini{min-height:110px;gap:5px}
.bars.mini .bw{max-width:44px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.82rem;color:#475569;margin:8px 2px}
.msgbox{background:var(--accent-soft);border-left:5px solid var(--accent);border-radius:0 12px 12px 0;padding:14px 16px;margin:8px 0;min-height:62px}
.msgbox.ok{background:var(--ok-soft);border-color:var(--ok)}
.msgbox.bad{background:var(--bad-soft);border-color:var(--bad)}
.stats{font-size:.88rem;color:#334155;font-weight:600;margin:4px 2px}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.ctrl .spd{font-size:.85rem;color:var(--muted);margin-left:auto}
.ctrl select{border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:#fff}
.stepno{font-size:.82rem;color:var(--muted)}
.cfg{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:10px}
.cfg select,.cfg input{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:#fff}

/* stack & queue */
.split{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:16px;align-items:start}
@media(max-width:700px){.split{grid-template-columns:1fr}}
.stk{display:flex;flex-direction:column;gap:5px;align-items:center;padding:10px;background:#fff;border:1px solid var(--line);border-radius:var(--r)}
.stk .slot{position:relative;width:170px;height:42px}
.stk.mini .slot{width:100px;height:30px}
.stk.mini{padding:6px;gap:3px}
.itm{width:100%;height:100%;border-radius:8px;border:2px solid var(--accent);background:var(--accent-soft);display:grid;place-items:center;font-weight:800;animation:pop .25s}
.itm.ghost{border:2px dashed #cbd5e1;background:transparent}
.itm.hl{background:#fde68a;border-color:var(--warn)}
.itm.out{background:var(--bad-soft);border-color:var(--bad)}
.topmk{position:absolute;left:calc(100% + 8px);top:50%;transform:translateY(-50%);font-size:.75rem;font-weight:800;color:var(--bad);white-space:nowrap}
.stk.mini .topmk{font-size:.65rem}
.stk .base{width:190px;height:8px;background:#94a3b8;border-radius:4px;font-size:0;margin-top:2px}
.stk.mini .base{width:116px}
.que{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-start;padding:12px;background:#fff;border:1px solid var(--line);border-radius:var(--r);justify-content:center}
.qs{display:flex;flex-direction:column;align-items:center;gap:4px;width:58px}
.que.mini .qs{width:62px}.que.mini .qs .lbl{font-size:.62rem}
.qs .itm{width:58px;height:46px}
.que.mini .qs .itm{width:42px;height:34px;font-size:.85rem}
.qs .lbl{font-size:.68rem;font-weight:800;color:var(--bad);min-height:16px;text-align:center;line-height:1.1}
.qdir{width:100%;display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);font-weight:700}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .3s}
.panel.inline{margin:0}
.ops{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.ops input{width:90px;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.status{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.status span{background:#f1f5f9;border-radius:8px;padding:3px 10px;font-size:.85rem;font-weight:600}
.status span.on{background:var(--warn-soft);color:#92400e}
.log{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.82rem;background:#0f172a;color:#e2e8f0;border-radius:10px;padding:10px 12px;min-height:92px;max-height:160px;overflow:auto}
.log div{padding:1px 0}
.log .e{color:#fda4af}

/* game */
.strip{position:relative;height:22px;background:#e2e8f0;border-radius:99px;overflow:hidden;margin:10px 0 2px}
.strip .rng{position:absolute;top:0;bottom:0;background:linear-gradient(90deg,#60a5fa,#2563eb);border-radius:99px;transition:all .35s}
.striplab{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted)}
.hist{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.hist span{background:#f1f5f9;border-radius:8px;padding:2px 9px;font-size:.84rem}

/* quiz */
.lvl{border:1px solid var(--line);border-radius:var(--r);padding:16px;background:#fff;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.lvl.lock{opacity:.6;background:#f8fafc}
.lvl .big{font-size:1.8rem}
.lvl .sc{font-weight:700}
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.dots{display:flex;gap:6px;margin-bottom:10px}
.dots i{flex:1;height:6px;border-radius:99px;background:var(--line)}
.dots i.cur{background:var(--accent)}
.dots i.ok{background:var(--ok)}
.dots i.no{background:var(--bad)}
.qtext{font-size:1.08rem;font-weight:600;color:var(--navy)}
.opts{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;cursor:pointer;transition:.15s}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt .k{flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:#e9edf6;display:grid;place-items:center;font-weight:800;font-size:.82rem}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .k{background:var(--ok);color:#fff}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt.no .k{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.ans{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}
.ans input{flex:1 1 200px;border:2px solid var(--line);border-radius:12px;padding:10px 12px}
.fb{border-radius:12px;padding:10px 14px;margin:8px 0}
.fb.ok{background:var(--ok-soft);border-left:5px solid var(--ok)}
.fb.no{background:var(--bad-soft);border-left:5px solid var(--bad)}
.score{font-size:3rem;font-weight:800;color:var(--navy);line-height:1}
.center{text-align:center}
.badge{display:inline-block;border-radius:99px;padding:2px 10px;font-size:.78rem;font-weight:700}
.badge.ok{background:var(--ok-soft);color:#166534}
.badge.no{background:var(--bad-soft);color:#9f1239}
.badge.nol{background:#f1f5f9;color:#64748b}
textarea.csvbox{width:100%;min-height:120px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.78rem;border:1px solid var(--line);border-radius:10px;padding:8px}
details{margin:10px 0}
summary{cursor:pointer;font-weight:700;color:var(--navy)}
footer{margin:24px 0 8px;text-align:center;color:var(--muted);font-size:.82rem}
footer label{cursor:pointer}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <div class="logo" aria-hidden="true">🧠</div>
      <div><h1>Algoritma Dasar</h1><p>Searching · Sorting · Stack · Queue</p></div>
    </div>
    <div class="who">
      <div><label for="nama">Nama siswa</label><input id="nama" placeholder="Tulis namamu" maxlength="60" autocomplete="off"></div>
      <div class="prog"><div class="t" id="progText"></div><div class="b"><i id="progBar" style="width:0%"></i></div></div>
    </div>
  </header>
  <nav id="nav" aria-label="Menu materi"></nav>
  <main id="view"></main>
  <footer>
    Materi pembelajaran Informatika · tanpa pemrograman · hasil tersimpan di perangkat ini dan dapat diunduh sebagai CSV<br>
    <label><input type="checkbox" id="guru"> Mode guru (buka semua level latihan)</label>
  </footer>
</div>

<script type="text/plain" id="csvdata">id,topik,level,tipe,pertanyaan,opsi_a,opsi_b,opsi_c,opsi_d,jawaban,penjelasan
LIN-11,linear,1,pg,Bagaimana cara linear search mencari sebuah data?,Membagi data menjadi dua bagian lalu memeriksa bagian tengah,Memeriksa elemen satu per satu mulai dari yang pertama,Mengurutkan data terlebih dahulu,Langsung melompat ke elemen terakhir,B,Linear search memeriksa elemen secara berurutan dari awal sampai data ditemukan atau semua elemen habis diperiksa.
LIN-12,linear,1,pg,Apakah data harus terurut agar linear search dapat digunakan?,"Ya, harus terurut naik","Ya, harus terurut turun","Tidak, data boleh dalam urutan apa saja",Hanya jika datanya berupa angka,C,Linear search tidak peduli urutan data. Ia hanya memeriksa satu per satu.
LIN-13,linear,1,pg,"Data: 4, 9, 2, 7. Kamu mencari angka 2. Berapa elemen yang diperiksa sampai 2 ditemukan?",2,3,4,1,B,"Diperiksa 4 (bukan), 9 (bukan), lalu 2 (ya). Total 3 pemeriksaan."
LIN-21,linear,2,isian,"Data: 12, 5, 8, 20, 3, 15. Kamu mencari angka 20 dengan linear search. Berapa kali pemeriksaan yang dilakukan sampai 20 ditemukan?",,,,,4,"Diperiksa 12, 5, 8, lalu 20, sehingga ada 4 pemeriksaan."
LIN-22,linear,2,pg,"Data: 6, 1, 9, 4. Kamu mencari angka 7 (tidak ada di data). Berapa elemen yang harus diperiksa sebelum disimpulkan 'tidak ditemukan'?",1,2,4,0,C,"Karena 7 tidak ada, semua 4 elemen harus diperiksa lebih dulu."
LIN-23,linear,2,pg,Kapan linear search selesai paling cepat (kasus terbaik)?,Saat target ada di elemen pertama,Saat target ada di elemen terakhir,Saat target tidak ada di data,Saat data sudah terurut,A,"Jika target ada di elemen pertama, cukup 1 pemeriksaan."

const fmt=s=>esc(s).replace(/\n/g,'<br>');
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]]}return a}
function randArr(n,min,max,sorted){const s=new Set();while(s.size<n)s.add(rnd(min,max));let a=Array.from(s);return sorted?a.sort((x,y)=>x-y):a}
const cleaners=[];

/* ============ CSV ============ */
function parseCSV(text){
  text=String(text||'').replace(/^﻿/,'');
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++} else q=false } else f+=c }
    else if(c==='"') q=true;
    else if(c===','){row.push(f);f=''}
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n')i++; row.push(f);f=''; if(row.some(x=>x!==''))rows.push(row); row=[] }
    else f+=c;
  }
  row.push(f); if(row.some(x=>x!==''))rows.push(row);
  if(!rows.length)return[];
  const head=rows[0].map(h=>h.trim().toLowerCase());
  return rows.slice(1).map(r=>{const o={};head.forEach((h,i)=>o[h]=(r[i]==null?'':r[i]));return o});
}
function csvCell(v){v=String(v==null?'':v);return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function toCSV(cols,rows){return [cols.join(',')].concat(rows.map(r=>cols.map(c=>csvCell(r[c])).join(','))).join('\n')}
function download(name,text){
  try{const b=new Blob(['﻿'+text],{type:'text/csv;charset=utf-8'});const u=URL.createObjectURL(b);
  const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000)}catch(e){}
}

/* ============ Komponen visual ============ */
function cellsRow(a,c={},p={},o={}){
  return `<div class="cells ${o.mini?'mini':''}">`+a.map((v,i)=>`<div class="cw"><div class="ptr">${p[i]||''}</div><div class="cell ${c[i]||''} ${o.click?'clk':''}" ${o.click?`data-i="${i}" role="button" tabindex="0"`:''}>${v}</div><div class="idx">${i}</div></div>`).join('')+`</div>`;
}
function barsRow(a,c={},p={},o={}){
  const mx=Math.max.apply(null,a),H=o.mini?64:150;
  return `<div class="bars ${o.mini?'mini':''}">`+a.map((v,i)=>`<div class="bw"><div class="bar ${c[i]||''} ${o.click?'clk':''}" ${o.click?`data-i="${i}" role="button" tabindex="0"`:''} style="height:${24+Math.round(v/mx*H)}px"><span>${v}</span></div><div class="idx">${i}</div><div class="ptr">${p[i]||''}</div></div>`).join('')+`</div>`;
}
function stackViz(items,cap,o={}){
  let h=`<div class="stk ${o.mini?'mini':''}">`;
  for(let k=cap-1;k>=0;k--){
    const has=k<items.length,top=has&&k===items.length-1;
    h+=`<div class="slot"><div class="itm ${has?'':'ghost'} ${top&&o.hl?o.hl:''}">${has?items[k]:''}</div>${top?'<span class="topmk">◀ TOP</span>':''}</div>`;
  }
  return h+`<div class="base"></div></div>`;
}
function queueViz(items,cap,o={}){
  let h=`<div class="que ${o.mini?'mini':''}"><div class="qdir"><span>◀ keluar (depan)</span><span>masuk (belakang) ◀</span></div>`;
  for(let k=0;k<cap;k++){
    const has=k<items.length;let lbl='';
    if(has){const f=k===0,r=k===items.length-1;lbl=f&&r?'DEPAN=<br>BELAKANG':f?'DEPAN<br>(front)':r?'BELAKANG<br>(rear)':''}
    h+=`<div class="qs"><div class="itm ${has?'':'ghost'} ${o.hlLast&&has&&k===items.length-1?'hl':''}">${has?items[k]:''}</div><div class="lbl">${lbl}</div></div>`;
  }
  return h+`</div>`;
}

/* ============ Pembuat langkah simulasi ============ */
function linearSteps(a,t){
  const S=[],done={};let cnt=0;
  S.push({stage:cellsRow(a),msg:`Kita mencari angka <b>${t}</b>. Pencarian dimulai dari elemen paling kiri (indeks 0).`,stats:'Pemeriksaan: 0'});
  for(let i=0;i<a.length;i++){
    cnt++;
    const c=Object.assign({},done);c[i]='cmp';
    S.push({stage:cellsRow(a,c,{[i]:'▼ cek'}),msg:`Periksa indeks <b>${i}</b>: nilainya <b>${a[i]}</b>. Apakah ${a[i]} sama dengan ${t}? ${a[i]===t?'<b>Ya!</b>':'Tidak, lanjut ke elemen berikutnya.'}`,stats:`Pemeriksaan: ${cnt}`});
    if(a[i]===t){
      const c2=Object.assign({},done);c2[i]='found';
      S.push({stage:cellsRow(a,c2,{[i]:'✔ ketemu'}),msg:`🎉 <b>Ditemukan!</b> Angka ${t} ada di indeks <b>${i}</b> setelah <b>${cnt}</b> pemeriksaan.`,stats:`Pemeriksaan: ${cnt}`,ok:1});
      return S;
    }
    done[i]='dim';
  }
  S.push({stage:cellsRow(a,done),msg:`Semua elemen sudah diperiksa dan tidak ada yang sama dengan ${t}. Kesimpulan: angka ${t} <b>tidak ada</b> di data (dibutuhkan ${cnt} pemeriksaan).`,stats:`Pemeriksaan: ${cnt}`,bad:1});
  return S;
}
function binarySteps(a,t){
  const S=[],n=a.length;let lo=0,hi=n-1,cnt=0;const dim={};
  S.push({stage:cellsRow(a),msg:`Data sudah <b>terurut</b>. Kita mencari <b>${t}</b>. Rentang pencarian awal: seluruh data (indeks 0 sampai ${n-1}).`,stats:'Perbandingan: 0'});
  while(lo<=hi){
    const mid=Math.floor((lo+hi)/2);cnt++;
    const c=Object.assign({},dim);for(let i=lo;i<=hi;i++)c[i]='range';c[mid]='mid';
    const p={};const lab=(i,x)=>{p[i]=(p[i]?p[i]+'·':'')+x};lab(lo,'L');lab(mid,'M');lab(hi,'R');
    S.push({kind:'mid',stage:cellsRow(a,c,p),stats:`Perbandingan: ${cnt} · Sisa data: ${hi-lo+1}`,
      msg:`Rentang indeks <b>${lo}–${hi}</b> (${hi-lo+1} data). Tengah = (${lo} + ${hi}) ÷ 2 = ${(lo+hi)/2}, dibulatkan ke bawah menjadi <b>${mid}</b>. Nilainya <b>${a[mid]}</b>.`});
    if(a[mid]===t){
      const c2=Object.assign({},dim);c2[mid]='found';
      S.push({stage:cellsRow(a,c2,{[mid]:'✔ ketemu'}),stats:`Perbandingan: ${cnt}`,ok:1,msg:`🎉 ${a[mid]} sama dengan target ${t}. <b>Ditemukan</b> di indeks ${mid} hanya dengan <b>${cnt}</b> perbandingan!`});
      return S;
    }
    let m;
    if(a[mid]<t){for(let i=lo;i<=mid;i++)dim[i]='dim';m=`${a[mid]} lebih <b>kecil</b> dari ${t}, jadi target pasti di <b>kanan</b>. Buang bagian kiri (indeks ${lo}–${mid}).`;lo=mid+1}
    else{for(let i=mid;i<=hi;i++)dim[i]='dim';m=`${a[mid]} lebih <b>besar</b> dari ${t}, jadi target pasti di <b>kiri</b>. Buang bagian kanan (indeks ${mid}–${hi}).`;hi=mid-1}
    const c3=Object.assign({},dim);for(let i=lo;i<=hi;i++)c3[i]='range';
    S.push({stage:cellsRow(a,c3),msg:m,stats:`Perbandingan: ${cnt} · Sisa data: ${Math.max(0,hi-lo+1)}`});
  }
  S.push({stage:cellsRow(a,dim),stats:`Perbandingan: ${cnt}`,bad:1,msg:`Rentang pencarian sudah habis. Angka ${t} <b>tidak ada</b> di data (${cnt} perbandingan).`});
  return S;
}
function bubbleSteps(arr,mini){
  const a=arr.slice(),n=a.length,S=[];let cmp=0,swp=0;const sorted={};const o={mini};
  const st=p=>`Pass: ${p} · Perbandingan: ${cmp} · Pertukaran: ${swp}`;
  S.push({stage:barsRow(a,{},{},o),msg:`Data awal. Kita urutkan dari <b>kecil ke besar</b>. Bandingkan dua elemen bersebelahan, tukar jika kiri lebih besar dari kanan.`,stats:st(0),kind:'start'});
  let early=false;
  for(let p=0;p<n-1;p++){
    let swapped=false;
    for(let j=0;j<n-1-p;j++){
      cmp++;
      const c=Object.assign({},sorted);c[j]='cmp';c[j+1]='cmp';
      const need=a[j]>a[j+1];
      S.push({stage:barsRow(a,c,{},o),stats:st(p+1),msg:`Bandingkan <b>${a[j]}</b> dan <b>${a[j+1]}</b>. ${need?`${a[j]} lebih besar dari ${a[j+1]}, urutannya salah, jadi <b>ditukar</b>.`:`${a[j]} ≤ ${a[j+1]}, urutannya sudah benar, <b>tidak ditukar</b>.`}`});
      if(need){
        swapped=true;swp++;const x=a[j];a[j]=a[j+1];a[j+1]=x;
        const c2=Object.assign({},sorted);c2[j]='swap';c2[j+1]='swap';
        S.push({stage:barsRow(a,c2,{},o),stats:st(p+1),msg:`Setelah ditukar: <b>${a[j]}</b> di kiri dan <b>${a[j+1]}</b> di kanan.`});
      }
    }
    sorted[n-1-p]='sorted';
    S.push({kind:'passEnd',stage:barsRow(a,Object.assign({},sorted),{},o),stats:st(p+1),msg:`<b>Pass ${p+1} selesai.</b> Angka <b>${a[n-1-p]}</b> sudah berada di posisi akhirnya. ${swapped?'Kondisi data: '+a.join(', ')+'.':''}`});
    if(!swapped){early=true;break}
  }
  const all={};for(let i=0;i<n;i++)all[i]='sorted';
  S.push({stage:barsRow(a,all,{},o),stats:st(early?'selesai':n-1),ok:1,msg:early?`🎉 Satu pass penuh <b>tanpa pertukaran</b> berarti data sudah urut. Selesai! Hasil: ${a.join(', ')}.`:`🎉 <b>Selesai!</b> Semua elemen sudah terurut: ${a.join(', ')}.`});
  return S;
}
function selectionSteps(arr,mini){
  const a=arr.slice(),n=a.length,S=[];let cmp=0,swp=0;const sorted={};const o={mini};
  const st=r=>`Putaran: ${r} · Perbandingan: ${cmp} · Pertukaran: ${swp}`;
  S.push({stage:barsRow(a,{},{},o),msg:`Data awal. Di setiap putaran kita <b>cari yang terkecil</b> dari bagian belum terurut, lalu tukar ke posisi paling depan bagian itu.`,stats:st(0),kind:'start'});
  for(let i=0;i<n-1;i++){
    let m=i;
    S.push({stage:barsRow(a,Object.assign({},sorted,{[i]:'min'}),{[i]:'min'},o),stats:st(i+1),msg:`<b>Putaran ${i+1}.</b> Bagian belum terurut mulai dari indeks ${i}. Anggap sementara <b>${a[i]}</b> adalah yang terkecil.`});
    for(let j=i+1;j<n;j++){
      cmp++;
      const c=Object.assign({},sorted);c[m]='min';c[j]='cmp';
      const sm=a[j]<a[m];
      S.push({stage:barsRow(a,c,{[m]:'min'},o),stats:st(i+1),msg:`Bandingkan <b>${a[j]}</b> dengan terkecil sementara <b>${a[m]}</b>. ${sm?`${a[j]} lebih kecil, jadi terkecil yang baru adalah <b>${a[j]}</b>.`:`${a[m]} tetap yang terkecil.`}`});
      if(sm)m=j;
    }
    if(m!==i){
      const c=Object.assign({},sorted);c[i]='swap';c[m]='swap';
      S.push({stage:barsRow(a,c,{},o),stats:st(i+1),msg:`Terkecil di bagian ini adalah <b>${a[m]}</b> (indeks ${m}). Tukar dengan <b>${a[i]}</b> di indeks ${i}.`});
      const x=a[i];a[i]=a[m];a[m]=x;swp++;
    }else{
      S.push({stage:barsRow(a,Object.assign({},sorted,{[i]:'min'}),{},o),stats:st(i+1),msg:`<b>${a[i]}</b> sudah yang terkecil dan sudah di posisi yang benar, tidak perlu menukar.`});
    }
    sorted[i]='sorted';
    S.push({kind:'roundEnd',stage:barsRow(a,Object.assign({},sorted),{},o),stats:st(i+1),msg:`<b>Putaran ${i+1} selesai.</b> Posisi ${i} terisi <b>${a[i]}</b>. Kondisi data: ${a.join(', ')}.`});
  }
  const all={};for(let i=0;i<n;i++)all[i]='sorted';
  S.push({stage:barsRow(a,all,{},o),stats:st(n-1),ok:1,msg:`🎉 <b>Selesai!</b> Semua elemen terurut: ${a.join(', ')}.`});
  return S;
}

/* ============ Player ============ */
function mountPlayer(host,cfg){
  host.innerHTML=`<div class="stage"></div>${cfg.legend?`<div class="legend">${cfg.legend.map(l=>`<span><i class="sw ${l[0]}"></i>${l[1]}</span>`).join('')}</div>`:''}
  <div class="msgbox" aria-live="polite"></div><div class="stats"></div>
  <div class="ctrl"><button class="btn" data-a="first">⏮ Ulang</button><button class="btn" data-a="prev">◀ Mundur</button><button class="btn primary" data-a="play">▶ Putar otomatis</button><button class="btn" data-a="next">Maju ▶</button><span class="stepno"></span><label class="spd">Kecepatan <select><option value="1500">Pelan</option><option value="950" selected>Sedang</option><option value="450">Cepat</option></select></label></div>`;
  const q=s=>host.querySelector(s);let steps=cfg.steps(),i=0,timer=null;
  function show(){
    const s=steps[i];q('.stage').innerHTML=s.stage;const mb=q('.msgbox');mb.innerHTML=s.msg;mb.className='msgbox'+(s.ok?' ok':s.bad?' bad':'');
    q('.stats').innerHTML=s.stats||'';q('.stepno').textContent=`Langkah ${i+1} dari ${steps.length}`;
    q('[data-a=prev]').disabled=i===0;q('[data-a=first]').disabled=i===0;q('[data-a=next]').disabled=i===steps.length-1;
  }
  function stop(){if(timer){clearInterval(timer);timer=null}q('[data-a=play]').textContent='▶ Putar otomatis'}
  function start(){
    if(i>=steps.length-1){i=0;show()}
    q('[data-a=play]').textContent='⏸ Jeda';
    timer=setInterval(()=>{if(i<steps.length-1){i++;show()}else stop()},+q('select').value);
  }
  host.addEventListener('click',e=>{
    const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
    if(a==='first'){stop();i=0;show()}
    else if(a==='prev'){stop();if(i>0){i--;show()}}
    else if(a==='next'){stop();if(i<steps.length-1){i++;show()}}
    else if(a==='play'){timer?stop():start()}
  });
  q('select').addEventListener('change',()=>{if(timer){stop();start()}});
  onLeave(stop);show();
  return{reload(){stop();steps=cfg.steps();i=0;show()}};
}
function modeTabs(host,modes){
  host.innerHTML=`<div class="seg" role="tablist">${modes.map((m,k)=>`<button data-m="${k}" role="tab">${m[0]}</button>`).join('')}</div><div class="mbody"></div>`;
  const body=host.querySelector('.mbody');
  function sel(k){$$('.seg button',host).forEach((b,j)=>b.classList.toggle('on',j===k));cleanup();body.innerHTML='';modes[k][1](body)}
  host.querySelector('.seg').addEventListener('click',e=>{const b=e.target.closest('button');if(b)sel(+b.dataset.m)});
  sel(0);
}

/* ============ Simulasi ============ */
function simLinear(host){
  modeTabs(host,[['🎬 Demo langkah demi langkah',linearDemo],['🎮 Coba sendiri: buka kotak',linearTry]]);
}
function linearDemo(host){
  let a=randArr(8,1,60),t=a[rnd(0,7)];const NF=99;
  host.innerHTML=`<div class="cfg"><label>Cari angka: <select id="tg"></select></label><button class="btn" id="nw">🎲 Data baru</button></div><div class="pl"></div>`;
  const sel=$('#tg',host);
  function fill(){sel.innerHTML=a.map(v=>`<option value="${v}">${v}</option>`).join('')+`<option value="${NF}">${NF} (tidak ada di data)</option>`;sel.value=String(t)}
  fill();
  const pl=mountPlayer($('.pl',host),{steps:()=>linearSteps(a,t),legend:[['cmp','Sedang diperiksa'],['dim','Sudah diperiksa'],['found','Ditemukan']]});
  sel.onchange=()=>{t=+sel.value;pl.reload()};
  $('#nw',host).onclick=()=>{a=randArr(8,1,60);t=a[rnd(0,7)];fill();pl.reload()};
}
function linearTry(host){
  let a,t,opened,done,fb;
  function init(){a=randArr(8,1,60);t=a[rnd(0,7)];opened={};done=false;fb='Klik kotak untuk membukanya. Temukan angka target dengan membuka sesedikit mungkin kotak!';draw()}
  function draw(){
    const c={};a.forEach((v,i)=>{if(!opened[i])c[i]='hid';else c[i]=(v===t?'found':'dim')});
    const vals=a.map((v,i)=>opened[i]?v:'?');
    const n=Object.keys(opened).length;
    host.innerHTML=`<div class="panel soft inline"><b>🎯 Target: ${t}</b> · Kotak terbuka: <b>${n}</b></div><div class="stage" style="margin-top:10px">${cellsRow(vals,c,{},{click:!done})}</div><div class="msgbox ${done?'ok':''}">${fb}</div><div class="ctrl"><button class="btn" id="rs">🔄 Main lagi</button></div>`;
    $('#rs',host).onclick=init;
  }
  host.addEventListener('click',e=>{
    const c=e.target.closest('[data-i]');if(!c||done)return;const i=+c.dataset.i;if(opened[i])return;

        else if(g<secret){fb=`${g} <b>terlalu kecil</b>. Semua angka sampai ${g} bisa dibuang.`;cls='';lo=Math.max(lo,g+1);hist.push(`${g} ↑`)}

function bubbleTry(host){
  let a,n=6,st;
  function init(){a=randArr(n,1,30);st={a,p:0,j:0,sorted:{},mist:0,swapped:false,done:false,fb:'Urutkan dari <b>kecil ke besar</b>. Dua batang yang menyala kuning sedang dibandingkan. Putuskan: <b>tukar</b> atau <b>jangan tukar</b>?',cls:''};draw()}
  function draw(){
    const c=Object.assign({},st.sorted);if(!st.done){c[st.j]='cmp';c[st.j+1]='cmp'}
    const x=st.a[st.j],y=st.a[st.j+1];
    host.innerHTML=`<div class="cfg"><label>Jumlah data: <select id="cn">${[5,6,7,8].map(v=>`<option ${v===n?'selected':''}>${v}</option>`).join('')}</select></label><button class="btn" id="nw">🎲 Data baru</button></div>
    <div class="stage">${barsRow(st.a,c)}</div>
    <div class="msgbox ${st.cls}" aria-live="polite">${st.fb}</div>
    <div class="stats">Pass: ${Math.min(st.p+1,n-1)} · Kesalahan: ${st.mist}</div>
    <div class="ctrl">${st.done?'<button class="btn primary" id="again">🔄 Main lagi</button>':`<span><b>${x}</b> dan <b>${y}</b>:</span><button class="btn bad" id="sw">🔁 Tukar</button><button class="btn good" id="ns">✋ Jangan tukar</button>`}</div>`;
    $('#cn',host).onchange=e=>{n=+e.target.value;init()};$('#nw',host).onclick=init;
    if(st.done)$('#again',host).onclick=init;
    else{$('#sw',host).onclick=()=>ans(true);$('#ns',host).onclick=()=>ans(false)}
  }
  function ans(swap){
    const j=st.j,x=st.a[j],y=st.a[j+1],need=x>y;
    if(swap===need){
      if(need){st.a[j]=y;st.a[j+1]=x;st.swapped=true;st.fb=`✅ Tepat! ${x} > ${y}, jadi ditukar.`}
      else st.fb=`✅ Tepat! ${x} ≤ ${y}, urutan sudah benar.`;
      st.cls='ok';st.j++;
      if(st.j>n-2-st.p){
        st.sorted[n-1-st.p]='sorted';
        if(!st.swapped){for(let i=0;i<n;i++)st.sorted[i]='sorted';st.done=true;st.fb+=` 🎉 Pass ini tanpa pertukaran, artinya data <b>sudah urut</b>. Kesalahanmu: ${st.mist}.`}
        else{st.p++;st.j=0;st.swapped=false;st.fb+=` Pass selesai, angka terbesar sudah di posisi akhir.`;if(st.p>=n-1){for(let i=0;i<n;i++)st.sorted[i]='sorted';st.done=true;st.fb+=` 🎉 Semua terurut! Kesalahanmu: ${st.mist}.`}}
      }
    }else{
      st.mist++;st.cls='bad';
      st.fb=need?`❌ Belum tepat. ${x} <b>lebih besar</b> dari ${y}, padahal yang kiri harus lebih kecil. Seharusnya <b>ditukar</b>.`:`❌ Belum tepat. ${x} sudah ≤ ${y}, urutannya sudah benar. Seharusnya <b>jangan ditukar</b>.`;
    }
    draw();
  }
  init();
}

    }else{st.mist++;st.cls='bad';st.fb=`❌ <b>${st.a[k]}</b> bukan yang terkecil, masih ada angka yang lebih kecil di bagian belum terurut. Periksa semua batang biru muda.`}
    draw();

function simStack(host){
  const CAP=6;let s=[],logs=[],hl='',nextV=rnd(1,99);
  function log(m,err){logs.unshift(`<div class="${err?'e':''}">› ${m}</div>`);logs=logs.slice(0,8)}
  function draw(shake){
    host.innerHTML=`<div class="split"><div class="${shake?'shake':''}">${stackViz(s,CAP,{hl})}</div><div>
    <div class="panel inline"><h3>Operasi stack</h3>
    <div class="ops"><input id="v" type="number" min="1" max="99" value="${nextV}" aria-label="Nilai"><button class="btn primary" id="push">⬇ push</button><button class="btn bad" id="pop">⬆ pop</button><button class="btn" id="peek">👁 peek</button><button class="btn" id="clr">🔄 Kosongkan</button></div>
    <div class="status"><span>Ukuran: ${s.length}/${CAP}</span><span class="${s.length===0?'on':''}">isEmpty: ${s.length===0?'ya':'tidak'}</span><span class="${s.length===CAP?'on':''}">isFull: ${s.length===CAP?'ya':'tidak'}</span></div>
    <div class="log" aria-live="polite">${logs.join('')||'<div>Belum ada operasi. Coba push beberapa angka lalu pop.</div>'}</div></div>
    <div class="tip">💡 <b>Coba:</b> push 3 angka berbeda, lalu pop satu kali. Angka mana yang keluar lebih dulu? Lalu coba pop saat kosong dan push saat penuh.</div></div></div>`;
    $('#push',host).onclick=()=>{
      const v=parseInt($('#v',host).value,10);
      if(!(v>=1&&v<=99)){log('Masukkan angka 1–99',1);hl='';return draw()}
      if(s.length>=CAP){log(`push(${v}) → <b>OVERFLOW</b>: stack penuh!`,1);hl='';return draw(1)}
      s.push(v);hl='';log(`push(${v}) → ukuran ${s.length}`);nextV=rnd(1,99);draw();
    };
    $('#pop',host).onclick=()=>{
      if(!s.length){log('pop() → <b>UNDERFLOW</b>: stack kosong!',1);hl='';return draw(1)}
      const v=s.pop();hl='';log(`pop() → ${v} keluar, ukuran ${s.length}`);draw();
    };
    $('#peek',host).onclick=()=>{
      if(!s.length){log('peek() → stack kosong, tidak ada puncak',1);hl='';return draw(1)}
      hl='hl';log(`peek() → puncak = ${s[s.length-1]} (tidak dihapus)`);draw();
    };
    $('#clr',host).onclick=()=>{s=[];logs=[];hl='';draw()};
  }
  draw();
}
function simQueue(host){
  const CAP=7;let q=[],logs=[],last=false,nextV=rnd(1,99);
  function log(m,err){logs.unshift(`<div class="${err?'e':''}">› ${m}</div>`);logs=logs.slice(0,8)}
  function draw(shake){
    host.innerHTML=`<div class="${shake?'shake':''}">${queueViz(q,CAP,{hlLast:last})}</div>
    <div class="panel inline" style="margin-top:12px"><h3>Operasi queue</h3>
    <div class="ops"><input id="v" type="number" min="1" max="99" value="${nextV}" aria-label="Nilai"><button class="btn primary" id="enq">➡ enqueue</button><button class="btn bad" id="deq">⬅ dequeue</button><button class="btn" id="fr">👁 front</button><button class="btn" id="clr">🔄 Kosongkan</button></div>
    <div class="status"><span>Ukuran: ${q.length}/${CAP}</span><span class="${q.length===0?'on':''}">isEmpty: ${q.length===0?'ya':'tidak'}</span><span class="${q.length===CAP?'on':''}">isFull: ${q.length===CAP?'ya':'tidak'}</span></div>
    <div class="log" aria-live="polite">${logs.join('')||'<div>Belum ada operasi. Coba enqueue beberapa angka lalu dequeue.</div>'}</div></div>
    <div class="tip">💡 <b>Coba:</b> enqueue 3 angka berbeda, lalu dequeue satu kali. Bandingkan dengan stack tadi: sekarang angka mana yang keluar lebih dulu?</div>`;
    $('#enq',host).onclick=()=>{
      const v=parseInt($('#v',host).value,10);
      if(!(v>=1&&v<=99)){log('Masukkan angka 1–99',1);last=false;return draw()}
      if(q.length>=CAP){log(`enqueue(${v}) → <b>OVERFLOW</b>: antrean penuh!`,1);last=false;return draw(1)}
      q.push(v);last=true;log(`enqueue(${v}) → masuk di belakang, ukuran ${q.length}`);nextV=rnd(1,99);draw();
    };
    $('#deq',host).onclick=()=>{
      if(!q.length){log('dequeue() → <b>UNDERFLOW</b>: antrean kosong!',1);last=false;return draw(1)}
      const v=q.shift();last=false;log(`dequeue() → ${v} keluar dari depan, ukuran ${q.length}`);draw();
    };
    $('#fr',host).onclick=()=>{
      if(!q.length){log('front() → antrean kosong',1);return draw(1)}
      log(`front() → elemen depan = ${q[0]} (tidak dihapus)`);draw();
    };
    $('#clr',host).onclick=()=>{q=[];logs=[];last=false;draw()};
  }
  draw();
}

function renderNav(){
  const n=$('#nav');
  n.innerHTML=`<button data-go="home" class="${state.page==='home'?'on':''}">🏠 Beranda</button>`+ORDER.map(k=>`<button data-go="topic:${k}" class="${state.page==='topic'&&state.topic===k?'on':''}">${T[k].ikon} ${T[k].nama}${passedCount(k)===3?'<span class="dot"></span>':''}</button>`).join('')+`<button data-go="hasil" class="${state.page==='hasil'?'on':''}">📊 Hasil</button>`;
}
function renderProg(){
  const p=totalPassed();$('#progText').textContent=`Kemajuan: ${p} dari 18 level lulus`;$('#progBar').style.width=Math.round(p/18*100)+'%';
}
function render(){
  cleanup();renderNav();renderProg();
  const v=$('#view');v.innerHTML='';
  if(state.page==='home')homeView(v);else if(state.page==='hasil')hasilView(v);else topicView(v,state.topic);
  try{window.scrollTo({top:0})}catch(e){}
}
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');if(!g)return;
  const p=g.dataset.go.split(':');
  if(p[0]==='home')go('home');else if(p[0]==='hasil')go('hasil');else go('topic',p[1],p[2]||'konsep');
});

function homeView(v){
  const p=totalPassed(),C=2*Math.PI*44;
  v.innerHTML=`<section class="hero"><div><h2>Selamat datang! 👋</h2><p>Belajar bagaimana komputer <b>mencari</b> dan <b>mengurutkan</b> data, serta dua struktur data dasar: <b>stack</b> dan <b>queue</b>. Semuanya dijelaskan lewat ilustrasi dan simulasi interaktif, <b>tanpa menulis kode</b>.</p><button class="btn primary big" data-go="topic:linear:konsep">Mulai belajar →</button></div>
  <div class="ring"><svg width="110" height="110" viewBox="0 0 110 110"><circle cx="55" cy="55" r="44" fill="none" stroke="#e2e8f0" stroke-width="10"/><circle cx="55" cy="55" r="44" fill="none" stroke="#16a34a" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p/18)}" transform="rotate(-90 55 55)"/><text x="55" y="62" text-anchor="middle" font-size="22" font-weight="800" fill="#0f1d3d">${Math.round(p/18*100)}%</text></svg><div class="muted" style="font-size:.82rem">${p}/18 level lulus</div></div></section>
  <h3 class="sec">Jalur belajar</h3><div class="path">${ORDER.map((k,i)=>{const t=T[k],c=passedCount(k);return `<button class="tcard" style="--c:${t.warna}" data-go="topic:${k}:konsep"><span class="ic">${t.ikon}</span><b>${i+1}. ${t.nama}</b><small>${t.tag}</small><span class="lvdots">${[1,2,3].map(l=>`<i class="${S.res[rk(k,l)]&&S.res[rk(k,l)].lulus?'ok':''}"></i>`).join('')}<span>${c}/3 level</span></span></button>`}).join('')}</div>
  <h3 class="sec">Cara belajar</h3><div class="steps3"><div class="panel"><span class="num">1</span><h4>Baca konsep</h4><p>Pahami ide, analogi, dan langkah kerja lewat ilustrasi.</p></div><div class="panel"><span class="num">2</span><h4>Coba simulasi</h4><p>Putar demo langkah demi langkah, lalu coba sendiri dan lihat apakah kamu bisa menebak langkah berikutnya.</p></div><div class="panel"><span class="num">3</span><h4>Kerjakan latihan</h4><p>Tiga level per topik. Capai skor minimal ${LULUS}% untuk membuka level berikutnya.</p></div></div>
  <h3 class="sec">Perbandingan singkat</h3><div class="grid3">
  <div class="tblwrap"><table class="cmp"><tr><th colspan="2">Linear vs Binary Search</th></tr><tr><td>Syarat data</td><td>Linear: bebas · Binary: terurut</td></tr><tr><td>Cara</td><td>Linear: satu per satu · Binary: bagi dua</td></tr><tr><td>1.000 data</td><td>Linear: sampai 1.000 · Binary: sekitar 10</td></tr></table></div>
  <div class="tblwrap"><table class="cmp"><tr><th colspan="2">Bubble vs Selection Sort</th></tr><tr><td>Ide</td><td>Bubble: tukar tetangga · Selection: pilih terkecil</td></tr><tr><td>Pertukaran</td><td>Bubble: banyak · Selection: maksimal n−1</td></tr><tr><td>5 data (terburuk)</td><td>Keduanya sampai 10 perbandingan</td></tr></table></div>
  <div class="tblwrap"><table class="cmp"><tr><th colspan="2">Stack vs Queue</th></tr><tr><td>Prinsip</td><td>Stack: LIFO · Queue: FIFO</td></tr><tr><td>Keluar dari</td><td>Stack: puncak · Queue: depan</td></tr><tr><td>Contoh</td><td>Stack: Undo · Queue: antrean printer</td></tr></table></div></div>`;
}

function topicView(v,k){
  const t=T[k];v.style.setProperty('--accent',t.warna);
  v.innerHTML=`<div class="thead" style="border-left-color:${t.warna}"><span class="ic">${t.ikon}</span><div><h2>${t.nama}</h2><p>${t.tag}</p></div></div>
  <div class="tabs" role="tablist">${[['konsep','📖 Konsep'],['simulasi','🎮 Simulasi'],['latihan','✍️ Latihan']].map(x=>`<button class="${state.tab===x[0]?'on':''}" data-tab="${x[0]}" role="tab">${x[1]}</button>`).join('')}</div><div id="tbody"></div>`;
  $$('.tabs button',v).forEach(b=>b.onclick=()=>{cleanup();state.tab=b.dataset.tab;topicView(v,k)});
  const body=$('#tbody',v);
  if(state.tab==='konsep')konsepView(body,k);else if(state.tab==='simulasi'){body.innerHTML='<div class="panel" id="simhost"></div>';SIM[k]($('#simhost',body))}else latihanView(body,k);
}
function konsepView(b,k){
  const t=T[k];
  b.innerHTML=`<div class="panel"><b>🎯 Tujuan belajar</b><div class="goal">${t.tujuan.map(x=>`<span>${x}</span>`).join('')}</div></div>
  <div class="grid2"><div class="panel"><h3>Apa itu ${t.nama}?</h3>${t.apa}</div><div class="panel callout"><h3>🧩 Analogi sehari-hari</h3><p>${t.analogi}</p></div></div>
  <div class="panel"><h3>${k==='stack'||k==='queue'?'Operasi utama':'Cara kerja'}</h3><ol class="steps">${t.langkah.map(x=>`<li>${x}</li>`).join('')}</ol></div>
  <div class="panel"><h3>🖼️ Ilustrasi</h3>${ILUS[k]()}</div>
  <div class="grid2"><div class="panel"><h3>Kelebihan</h3><ul class="plus">${t.plus.map(x=>`<li>${x}</li>`).join('')}</ul></div><div class="panel"><h3>Keterbatasan</h3><ul class="minus">${t.minus.map(x=>`<li>${x}</li>`).join('')}</ul></div></div>
  <div class="panel soft"><h3>📌 Ingat!</h3><ul>${t.ingat.map(x=>`<li>${x}</li>`).join('')}</ul></div>
  <div class="center" style="margin:16px 0"><button class="btn primary big" data-go="topic:${k}:simulasi">Coba simulasinya →</button></div>`;
}

/* ============ Latihan ============ */
function latihanView(b,k){
  const lv=[1,2,3];
  b.innerHTML=`<div class="panel"><h3>Latihan berjenjang</h3><p>Selesaikan setiap level dengan skor minimal <b>${LULUS}%</b> untuk membuka level berikutnya. Hasilmu tersimpan otomatis dan bisa diunduh sebagai file <b>CSV</b> di menu <b>📊 Hasil</b>.</p></div><div class="grid3" id="lvls"></div><div id="qarea"></div>`;
  $('#lvls',b).innerHTML=lv.map(l=>{
    const qs=BANK.filter(q=>q.topik===k&&q.level===l),r=S.res[rk(k,l)];
    const open=l===1||S.guru||(S.res[rk(k,l-1)]&&S.res[rk(k,l-1)].lulus);
    return `<div class="lvl ${open?'':'lock'}"><span class="big">${open?LEVELS[l].ikon:'🔒'}</span><b>${LEVELS[l].nama}</b><span class="muted">${LEVELS[l].desc} · ${qs.length} soal</span>
    ${r?`<span class="sc">Skor terbaik: ${r.best}/${r.total} ${r.lulus?'<span class="badge ok">Lulus</span>':'<span class="badge no">Belum lulus</span>'}</span>`:'<span class="badge nol" style="align-self:flex-start">Belum dikerjakan</span>'}
    <button class="btn primary" data-lv="${l}" ${open&&qs.length?'':'disabled'}>${r?'Kerjakan lagi':'Mulai'}</button>${open?'':'<small class="muted">Lulus Level '+(l-1)+' dulu untuk membuka.</small>'}</div>`;
  }).join('');
  $$('[data-lv]',b).forEach(x=>x.onclick=()=>{$('#lvls',b).style.display='none';runQuiz($('#qarea',b),k,+x.dataset.lv,()=>{state.tab='latihan';render()})});
}
const normAns=s=>String(s).toLowerCase().replace(/\s+/g,'').replace(/[;،，]/g,',');
function runQuiz(host,k,level,back){
  const qs=BANK.filter(q=>q.topik===k&&q.level===level);
  let i=0,ok=0,marks=[];
  function showQ(){
    const q=qs[i];
    host.innerHTML=`<div class="panel quiz"><div class="qhead"><span class="chip">${LEVELS[level].ikon} ${LEVELS[level].nama}</span><span class="muted">Soal ${i+1} dari ${qs.length}</span></div>
    <div class="dots">${qs.map((_,j)=>`<i class="${j<i?marks[j]:j===i?'cur':''}"></i>`).join('')}</div>
    <p class="qtext">${fmt(q.pertanyaan)}</p><div class="opts"></div><div class="fb" style="display:none"></div><div class="ctrl" id="qn"></div></div>`;
    const opts=$('.opts',host);
    if(q.tipe==='isian'){
      opts.outerHTML=`<div class="ans"><input id="ai" placeholder="Tulis jawabanmu" autocomplete="off"><button class="btn primary" id="ab">Periksa</button></div>`;
      const inp=$('#ai',host);inp.focus();
      const chk=()=>{if(!inp.value.trim())return;const right=q.jawaban.split('|').some(x=>normAns(x)===normAns(inp.value));inp.disabled=true;$('#ab',host).disabled=true;inp.style.borderColor=right?'var(--ok)':'var(--bad)';done(right,inp.value.trim(),right?'':`Jawaban yang benar: <b>${esc(q.jawaban.split('|')[0])}</b>.`)};
      $('#ab',host).onclick=chk;inp.onkeydown=e=>{if(e.key==='Enter')chk()};
    }else{
      const raw=[['A',q.opsi_a],['B',q.opsi_b],['C',q.opsi_c],['D',q.opsi_d]].filter(o=>o[1]);
      const sh=shuffle(raw);const L='ABCD';
      opts.innerHTML=sh.map((o,j)=>`<button class="opt" data-k="${o[0]}"><span class="k">${L[j]}</span><span>${esc(o[1])}</span></button>`).join('');
      $$('.opt',opts).forEach(btn=>btn.onclick=()=>{
        const right=btn.dataset.k===q.jawaban.toUpperCase();
        $$('.opt',opts).forEach(x=>{x.disabled=true;if(x.dataset.k===q.jawaban.toUpperCase())x.classList.add('ok')});
        if(!right)btn.classList.add('no');
        done(right,btn.dataset.k+': '+(raw.find(o=>o[0]===btn.dataset.k)||[0,''])[1],'');
      });
    }
    function done(right,given,extra){
      if(right)ok++;marks[i]=right?'ok':'no';
      S.log.push({nama:S.nama,waktu:new Date().toISOString(),topik:k,level,id_soal:q.id,tipe:q.tipe,jawaban_siswa:given,benar:right?1:0});
      if(S.log.length>3000)S.log=S.log.slice(-3000);
      const fb=$('.fb',host);fb.style.display='block';fb.className='fb '+(right?'ok':'no');
      fb.innerHTML=`<b>${right?'✅ Benar!':'❌ Belum tepat.'}</b> ${extra} ${esc(q.penjelasan)}`;
      $('#qn',host).innerHTML=`<button class="btn primary" id="nx">${i<qs.length-1?'Soal berikutnya →':'Lihat hasil →'}</button>`;
      $('#nx',host).onclick=()=>{i++;i<qs.length?showQ():finish()};$('#nx',host).focus();
    }
  }
  function finish(){
    const total=qs.length,pct=Math.round(ok/total*100),lulus=pct>=LULUS;
    const key=rk(k,level),old=S.res[key]||{best:0,attempts:0,lulus:false};
    S.res[key]={topik:k,level,best:Math.max(old.best,ok),last:ok,total,attempts:old.attempts+1,lulus:old.lulus||lulus,waktu:new Date().toISOString()};
    saveS();renderNav();renderProg();
    const nextOpen=lulus&&level<3;
    host.innerHTML=`<div class="panel center"><div class="score">${ok}/${total}</div><p class="muted">${pct}%</p><h3>${lulus?'🎉 Lulus! Kerja bagus.':'Belum lulus. Tetap semangat!'}</h3>
    <p>${lulus?(level<3?`Level ${level+1} sekarang terbuka.`:'Kamu menyelesaikan semua level topik ini.'):`Skor minimal untuk lulus adalah ${LULUS}%. Baca lagi konsep atau coba simulasi, lalu ulangi.`}</p>
    <div class="ctrl" style="justify-content:center"><button class="btn" id="rt">🔄 Ulangi level ini</button>${nextOpen?`<button class="btn primary" id="nl">Lanjut ke Level ${level+1} →</button>`:''}<button class="btn" id="bk">Kembali ke daftar level</button><button class="btn" data-go="topic:${k}:konsep">📖 Baca konsep</button></div></div>`;
    $('#rt',host).onclick=()=>runQuiz(host,k,level,back);$('#bk',host).onclick=back;
    if(nextOpen)$('#nl',host).onclick=()=>runQuiz(host,k,level+1,back);
  }
  if(!qs.length){host.innerHTML='<div class="panel">Belum ada soal untuk level ini.</div>';return}
  showQ();
}

/* ============ Hasil ============ */
const SUM_COLS=['nama','topik','nama_topik','level','skor_terbaik','skor_terakhir','total_soal','persen_terbaik','status','percobaan','waktu_terakhir'];
const LOG_COLS=['nama','waktu','topik','level','id_soal','tipe','jawaban_siswa','benar'];
function summaryRows(){
  const rows=[];
  ORDER.forEach(k=>[1,2,3].forEach(l=>{
    const r=S.res[rk(k,l)];
    rows.push({nama:S.nama,topik:k,nama_topik:T[k].nama,level:l,skor_terbaik:r?r.best:'',skor_terakhir:r?r.last:'',total_soal:r?r.total:BANK.filter(q=>q.topik===k&&q.level===l).length,persen_terbaik:r?Math.round(r.best/r.total*100):'',status:r?(r.lulus?'Lulus':'Belum lulus'):'Belum dikerjakan',percobaan:r?r.attempts:0,waktu_terakhir:r?r.waktu:''});
  }));
  return rows;
}
function hasilView(v){
  const rows=summaryRows();
  v.innerHTML=`<div class="panel"><h3>📊 Hasil belajar${S.nama?' · '+esc(S.nama):''}</h3>
  <p>Kemajuan: <b>${totalPassed()}</b> dari 18 level lulus. ${S.nama?'':'<span class="badge no">Isi nama di bagian atas agar tercantum di file CSV.</span>'}</p>
  <div class="tblwrap"><table class="cmp"><tr><th>Topik</th><th>Level 1</th><th>Level 2</th><th>Level 3</th></tr>${ORDER.map(k=>`<tr><td>${T[k].ikon} ${T[k].nama}</td>${[1,2,3].map(l=>{const r=S.res[rk(k,l)];return `<td>${r?`${r.best}/${r.total} ${r.lulus?'<span class="badge ok">Lulus</span>':'<span class="badge no">Belum</span>'}`:'<span class="badge nol">–</span>'}</td>`}).join('')}</tr>`).join('')}</table></div></div>
  <div class="panel"><h3>💾 Simpan sebagai CSV</h3><p>Unduh hasil lalu kirimkan filenya kepada guru. File yang sama dapat dimuat kembali untuk melanjutkan di perangkat lain.</p>
  <div class="ops"><button class="btn primary" id="e1">⬇ Unduh hasil ringkas (.csv)</button><button class="btn" id="e2">⬇ Unduh detail jawaban (.csv)</button><label class="btn" style="cursor:pointer">⬆ Muat hasil dari CSV<input type="file" id="imp" accept=".csv,text/csv" hidden></label><button class="btn danger" id="rst">🗑 Hapus semua hasil</button></div>
  <div id="csvout"></div></div>
  <details class="panel"><summary>⚙️ Pengaturan guru: bank soal</summary>
  <p>Bank soal aktif: <b>${BANK.length} soal</b> (sumber: ${BANKSRC}). Soal disimpan dalam file CSV dengan kolom <code>id, topik, level, tipe, pertanyaan, opsi_a, opsi_b, opsi_c, opsi_d, jawaban, penjelasan</code>. Tipe <code>pg</code> memakai jawaban huruf A–D; tipe <code>isian</code> memakai teks (beberapa jawaban alternatif dipisah tanda <code>|</code>).</p>
  <div class="ops"><button class="btn" id="eb">⬇ Unduh bank soal (soal.csv)</button><label class="btn" style="cursor:pointer">⬆ Muat bank soal dari CSV<input type="file" id="ib" accept=".csv,text/csv" hidden></label></div><div id="bmsg" class="muted"></div></details>`;
  const show=(text,name)=>{download(name,text);$('#csvout',v).innerHTML=`<p class="muted" style="margin-top:10px">Jika unduhan tidak berjalan di Canvas, salin teks berikut dan simpan sebagai <b>${name}</b>:</p><textarea class="csvbox" readonly>${esc(text)}</textarea>`;const ta=$('.csvbox',v);ta.onfocus=()=>ta.select()};
  $('#e1',v).onclick=()=>show(toCSV(SUM_COLS,summaryRows()),'hasil-algoritma-dasar.csv');
  $('#e2',v).onclick=()=>show(toCSV(LOG_COLS,S.log),'detail-jawaban-algoritma-dasar.csv');
  $('#imp',v).onchange=e=>{
    const f=e.target.files[0];if(!f)return;const rd=new FileReader();
    rd.onload=()=>{const rs=parseCSV(rd.result);let n=0;
      rs.forEach(r=>{const k=(r.topik||'').toLowerCase(),l=parseInt(r.level,10);
        if(ORDER.indexOf(k)<0||!(l>=1&&l<=3)||r.skor_terbaik===''||r.skor_terbaik==null)return;
        S.res[rk(k,l)]={topik:k,level:l,best:+r.skor_terbaik,last:+(r.skor_terakhir||r.skor_terbaik),total:+r.total_soal||3,attempts:+r.percobaan||1,lulus:r.status==='Lulus',waktu:r.waktu_terakhir||new Date().toISOString()};n++;
        if(r.nama&&!S.nama){S.nama=r.nama;$('#nama').value=S.nama}});
      saveS();renderNav();renderProg();alert(n?`Berhasil memuat ${n} hasil.`:'Tidak ada data hasil yang bisa dimuat dari file ini.');hasilView(v)};
    rd.readAsText(f);
  };
  $('#rst',v).onclick=()=>{if(confirm('Hapus semua hasil latihan di perangkat ini? Tindakan ini tidak bisa dibatalkan.')){S.res={};S.log=[];saveS();render()}};
  $('#eb',v).onclick=()=>{const cols=['id','topik','level','tipe','pertanyaan','opsi_a','opsi_b','opsi_c','opsi_d','jawaban','penjelasan'];show(toCSV(cols,BANK),'soal.csv')};
  $('#ib',v).onchange=e=>{
    const f=e.target.files[0];if(!f)return;const rd=new FileReader();
    rd.onload=()=>{const b=parseBank(rd.result);if(!b.length){$('#bmsg',v).textContent='File tidak valid: tidak ada baris soal yang terbaca.';return}BANK=b;BANKSRC='file yang Anda muat';$('#bmsg',v).textContent=`Berhasil memuat ${b.length} soal. (Berlaku sampai halaman ditutup. Untuk permanen, ganti file soal.csv di hosting.)`;}
    rd.readAsText(f);
  };
}

/* ============ Init ============ */
$('#nama').value=S.nama||'';
$('#nama').addEventListener('input',e=>{S.nama=e.target.value.trim();saveS()});
$('#guru').checked=!!S.guru;
$('#guru').addEventListener('change',e=>{S.guru=e.target.checked;saveS();render()});
loadBank().then(render);
window.__app={parseCSV,linearSteps,binarySteps,bubbleSteps,selectionSteps,get BANK(){return BANK}};
})();
</script>
</body>
